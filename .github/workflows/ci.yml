name: CI

on:
  push:
    branches: [ main, develop, feature/execution-records ]
  pull_request:
    branches: [ main, develop, feature/execution-records ]

jobs:
  test-lint-migrate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: yusbuild
          POSTGRES_USER: yusbuild
          POSTGRES_PASSWORD: yusbuild
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U yusbuild"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_SETTINGS_MODULE: config.test_settings
      DATABASE_URL: postgres://yusbuild:yusbuild@127.0.0.1:5432/yusbuild

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.5.0
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev postgresql-client

      - name: Clear pip cache
        run: pip cache purge

      - name: Install pip dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.15.12
          python -m pip install -r requirements.txt

      - name: Clear Ruff cache
        run: python -m ruff clean

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Check formatting with Ruff
        run: python -m ruff format --check .

      # ... keep the rest of your postgres, migration, and test steps exactly the same
      - name: Wait for Postgres
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U yusbuild; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Print DATABASE_URL
        run: echo "DATABASE_URL=$DATABASE_URL"

      - name: Test Postgres connection
        env:
          PGPASSWORD: yusbuild
        run: |
          psql -h 127.0.0.1 -p 5432 -U yusbuild -d yusbuild -c "SELECT 1;"

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: pytest

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov

  docker-build:
    runs-on: ubuntu-latest
    needs: test-lint-migrate
    steps:
      - uses: actions/checkout@v4.2.2
      
      - name: Build Docker image
        run: docker build -t yusbuild:ci .